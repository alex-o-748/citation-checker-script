<svg xmlns="http://www.w3.org/2000/svg" width="920" height="680" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">ROC curves for citation-verification providers on the strict benchmark set</title>
<desc id="desc">False positive rate is on the horizontal axis and true positive rate is on the vertical axis. Curves closer to the upper-left corner distinguish failing citations better. Eight providers are shown, with AUC values in the legend.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202122}.grid{stroke:#c8ccd1;stroke-width:1}.axis{stroke:#202122;stroke-width:1.5}.curve{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.tick{font-size:13px}.label{font-size:16px;font-weight:600}.legend{font-size:13px}</style>
<text x="105" y="34" font-size="22" font-weight="700">Detecting citations that need review</text>
<text x="105" y="56" font-size="13" fill="#54595d">Strict set (whole source available) · positive class = anything but SUPPORTED</text>
