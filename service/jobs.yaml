# Scheduled Toolforge jobs for the batch pipeline.
#
# Load one job (leaves every other job of the tool alone):
#   toolforge jobs load ~/citation-checker-script/service/jobs.yaml --job ruwiki-sweep
# Run it once now, outside the schedule:
#   toolforge jobs run ruwiki-sweep-now --image node18 --mem 2Gi --wait \
#       --command "node citation-checker-script/service/run-periodic.js --wiki ruwiki --max 100"
#
# Jobs start in the tool's home directory, where the repo is checked out as
# citation-checker-script/ (git pull there to deploy; nothing here pulls).
# Each run writes ~/sweeps/<wiki>/<UTC time>/, with summary.md first to read;
# ~/sweeps/<wiki>/latest.json names the newest run. See service/run-periodic.js.
#
# emails: onfailure covers a halted run (exit 3/4) and a finished run whose
# post-run checks failed (exit 5), a run skipped because the previous one
# still holds the lock (exit 6), and a recheck pass that errored on most of
# its rows, i.e. its Hugging Face model was unreachable or rate-limited
# (exit 7; resume the run once it answers).
#
# 2Gi: what run-pick-pilot.js needs, and what the sweep fits in since its
# source cache was bounded (service/claim-extractor.js). Steps run one at a
# time, each in its own process, so the largest single step sets the size.

- name: ruwiki-sweep
  # 3 articles a week while the schedule is an experiment; raise --max once
  # a few runs have been read end to end.
  #
  # Rechecks on Lift Wing for now: since 2026-11-26 Hugging Face has answered
  # every tf-llm-router /hf call with a 429, which would fail both default
  # passes (Qwen3-32B, GLM-5.2; 83% precision together on the labelled 50).
  # Lift Wing Qwen3.8 measured 61% there. It is also the model the sweep
  # flags with, so this is the same model re-reading each flag against a
  # fresh fetch, not a second model's opinion. Drop the --recheck flag to go
  # back to the default pair once /hf answers again.
  command: >-
    node citation-checker-script/service/run-periodic.js --wiki ruwiki --max 3
    --recheck qwen38:liftwing:llm-qwen38-27b
  image: node18
  schedule: "0 3 * * 1"   # Mondays 03:00 UTC
  emails: onfailure
  mem: 2Gi
  filelog: true
